<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZalxZhu — bot WhatsApp dan alat web</title><meta name="description" content="Hub proyek ZalxZhu: Haruka, Ellen Joe, dan alat web lainnya.">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/rhamt24/zalxzhu.github.io/images/f1e63c4922f7d0b0fc4cf9f7b30cef45.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0d12;--panel:#12151d;--line:#232836;--fog:#9aa3b5;--bone:#eef0f5;--rose:#ff6b8b;--fin:#6fd3d0;--on:#4ade80;--off:#f87171}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.65 Manrope,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 40vmax at 85% -10%,#ff6b8b26,transparent 60%),radial-gradient(50vmax 40vmax at -10% 60%,#6fd3d01c,transparent 60%)}
a{color:inherit}h1,h2,h3{font-family:Fraunces,serif;font-weight:500;line-height:1.15;margin:0}
nav{position:sticky;top:0;z-index:20;display:flex;gap:4px;justify-content:center;padding:12px;background:#0b0d12d9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav a{padding:8px 14px;border-radius:99px;text-decoration:none;color:var(--fog);font-size:14px;font-weight:600}nav a.on{color:var(--ink);background:var(--bone)}
main{max-width:1040px;margin:auto;padding:0 20px 140px}section{padding:72px 0 8px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;min-height:78vh;padding-top:40px}
.hero h1{font-size:clamp(40px,7vw,76px);letter-spacing:-.02em}.hero h1 i{color:var(--rose)}
.hero p{color:var(--fog);max-width:46ch;font-size:18px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;color:var(--bone);font-family:inherit}
.btn.p{background:var(--rose);border-color:var(--rose);color:#1a0b10}.btn:hover{border-color:var(--fog)}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:8px}.sub{color:var(--fog);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:12px}.card p{margin:0;color:var(--fog);font-size:15px}
.pill{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--fog)}
.pill.aktif{color:var(--on);border-color:#4ade8055}.pill.segera{color:var(--fin);border-color:#6fd3d055}.card.pensiun{opacity:.7}.card.pensiun img{filter:grayscale(1)}
.feed{display:grid;gap:14px}.item{border-left:2px solid var(--rose);padding:2px 0 2px 18px}.item small{color:var(--fog)}.item p{margin:6px 0 0;color:#cfd4e0}.item img,.item video{max-width:100%;border-radius:12px;margin-top:10px}
.st{display:flex;align-items:center;gap:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--off)}.dot.on{background:var(--on);box-shadow:0 0 0 0 #4ade8088;animation:p 2s infinite}@keyframes p{70%{box-shadow:0 0 0 10px #0000}}
#ellen{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:calc(100vw - 32px)}
#bub{background:var(--bone);color:var(--ink);padding:12px 16px;border-radius:16px 16px 4px 16px;font-size:14px;max-width:260px;box-shadow:0 12px 30px #0008;transition:.25s}#bub.h{opacity:0;transform:translateY(8px);pointer-events:none}
#bub div{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}#bub button{border:1px solid #0003;background:#0000000d;border-radius:99px;padding:4px 10px;font:600 12px Manrope;cursor:pointer;color:var(--ink)}
#av{width:84px;height:84px;border-radius:50%;border:3px solid var(--rose);object-fit:cover;cursor:pointer;background:var(--panel);transition:transform .15s;box-shadow:0 8px 24px #ff6b8b44}#av:active{transform:scale(.92)}#av.z{animation:z 3s ease-in-out infinite}@keyframes z{50%{transform:translateY(4px) rotate(-4deg)}}
.hero .art{justify-self:center;position:relative}.hero .art img{width:min(300px,70vw);aspect-ratio:1;border-radius:36% 64% 58% 42%/42% 40% 60% 58%;object-fit:cover;border:1px solid var(--line);box-shadow:0 30px 80px #ff6b8b33;transition:transform .2s}
#qm{display:none;position:fixed;inset:0;z-index:50;background:#000c;align-items:center;justify-content:center;padding:20px}#qm.o{display:flex}#qm img{width:min(320px,100%);border-radius:18px;background:#fff;padding:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto;gap:28px}.hero .art{order:-1}nav a{padding:8px 10px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--fin);outline-offset:2px}
</style></head><body>
<nav id="nav"><a href="#home" class="on">Beranda</a><a href="#proyek">Proyek</a><a href="#news">News</a><a href="#status">Status</a><a href="#diskusi">Diskusi</a></nav>
<main>
<section id="home" class="hero"><div><h1 id="nm">ZalxZhu</h1><p id="tg"></p><div class="row"><a class="btn p" href="#proyek">Lihat proyek</a><a class="btn" id="gh" target="_blank" rel="noopener">GitHub</a><a class="btn" id="ch" target="_blank" rel="noopener">Channel WhatsApp</a><button class="btn" id="qb">Dukung via QRIS</button></div></div><div class="art"><img id="hero" alt="Ellen Joe"></div></section>
<section id="proyek"><h2>Proyek</h2><p class="sub">Bot dan alat yang sedang dan pernah dibuat.</p><div class="grid" id="pj"></div></section>
<section id="news"><h2>News</h2><p class="sub">Kabar terbaru, terbaru di atas.</p><div class="feed" id="nw">Memuat…</div></section>
<section id="status"><h2>Status bot</h2><p class="sub">Online jika melapor dalam 2 menit terakhir.</p><div class="grid" id="stt"></div></section>
<section id="diskusi"><h2>Diskusi</h2><p class="sub">Saran dan pertanyaan lewat GitHub.</p>
<script src="https://giscus.app/client.js" data-repo="rhamt24/zalxzhu.my.id" data-repo-id="R_kgDOPIa_rg" data-category="General" data-category-id="DIC_kwDOPIa_rs4C1LCD" data-mapping="pathname" data-reactions-enabled="1" data-input-position="top" data-theme="transparent_dark" data-lang="id" async></script></section>
</main>
<div id="ellen"><div id="bub" class="h"><span id="tx"></span><div><button id="c1">Status bot?</button><button id="c2">Putar lagu</button></div></div><img id="av" alt="Ketuk Ellen Joe" tabindex="0"></div>
<div id="qm"><img id="qi" alt="QRIS"></div><audio id="au" loop></audio>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,clicks=0,idle,said={};
fetch('data/site.json').then(r=>r.json()).then(d=>{D=d;init()});
function init(){const p=D.profile,e=D.ellen;$('#nm').innerHTML=E(p.name).replace(/^(.)(.*)$/,'$1<i>$2</i>');$('#tg').textContent=p.tagline;$('#gh').href=p.github;$('#ch').href=p.channel;$('#qi').src=p.qris;
$('#hero').src=$('#av').src=e.image;$('#au').src=e.music;$('#au').volume=.25;
$('#pj').innerHTML=D.projects.map(x=>`<article class="card ${x.state}">${x.thumb?`<img src="${E(x.thumb)}" alt="" loading="lazy">`:''}<span class="pill ${x.state}">${E(x.state)} · ${E(x.tag)}</span><h3>${E(x.name)}</h3><p>${E(x.desc)}</p>${x.url?`<a class="btn" target="_blank" rel="noopener" href="${E(x.url)}">${E(x.cta||'Buka')}</a>`:''}</article>`).join('');
news();status();setInterval(status,60000);say(e.pages.home,5000);sleepTimer()}
async function news(){let n=[...D.news];try{const s=D.supabase,r=await fetch(`${s.url}/rest/v1/news?select=*&order=created_at.desc`,{headers:{apikey:s.key,Authorization:'Bearer '+s.key}});if(r.ok)n.push(...(await r.json()).map(x=>({date:x.created_at,title:x.title,text:x.content,media:x.media_url,video:x.type==='video'})))}catch{}
n.sort((a,b)=>new Date(b.date)-new Date(a.date));$('#nw').innerHTML=n.length?n.map(x=>`<article class="item"><small>${new Date(x.date).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</small><h3>${E(x.title)}</h3><p>${E(x.text)}</p>${x.media?(x.video?`<video src="${E(x.media)}" controls></video>`:`<img src="${E(x.media)}" alt="" loading="lazy">`):''}</article>`).join(''):'Belum ada berita.'}
async function status(){$('#stt').innerHTML=D.status.map((s,i)=>`<div class="card"><h3>${E(s.name)}</h3><div class="st"><span class="dot" id="d${i}"></span><b id="t${i}">…</b></div><p id="m${i}"></p></div>`).join('');
window.up={};await Promise.all(D.status.map(async(s,i)=>{try{const r=await fetch('/api/status?id='+s.gist);if(!r.ok)throw 0;const j=await r.json(),on=Date.now()-j.last_update<12e4;up[s.name]=on;$('#d'+i).className='dot'+(on?' on':'');$('#t'+i).textContent=on?'Online':'Offline';$('#m'+i).textContent='Update terakhir: '+new Date(j.last_update).toLocaleString('id-ID')}catch{$('#t'+i).textContent='Tidak terbaca'}}))}
/* Ellen Joe */
const bub=$('#bub'),au=$('#au');let hide;
function say(t,ms=4500){$('#tx').textContent=t;bub.classList.remove('h');$('#av').classList.remove('z');clearTimeout(hide);hide=setTimeout(()=>bub.classList.add('h'),ms);sleepTimer()}
function sleepTimer(){clearTimeout(idle);idle=setTimeout(()=>{$('#av').classList.add('z');say(D.ellen.sleep,6000);$('#av').classList.add('z')},30000)}
$('#av').onclick=()=>{clicks++;const L=D.ellen.lines;say(clicks%7===0?D.ellen.angry:L[Math.floor(Math.random()*L.length)])};
$('#av').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('#av').click()};
$('#c1').onclick=()=>{const k=Object.keys(up||{});say(k.length?k.map(n=>`${n}: ${up[n]?'online':'offline'}`).join(' • '):'Belum ada data status.',6000)};
$('#c2').onclick=()=>{if(au.paused){au.play().then(()=>{$('#c2').textContent='Jeda lagu';say('♪ '+D.ellen.song)}).catch(()=>{})}else{au.pause();$('#c2').textContent='Putar lagu'}};
addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*14,y=(e.clientY/innerHeight-.5)*14;$('#hero').style.transform=`translate(${x}px,${y}px) rotate(${x/3}deg)`},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const id=en.target.id;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+id));if(D&&!said[id]&&id!=='home'){said[id]=1;say(D.ellen.pages[id])}}}),{threshold:.5});
document.querySelectorAll('main>section').forEach(s=>io.observe(s));
$('#qb').onclick=()=>$('#qm').classList.add('o');$('#qm').onclick=()=>$('#qm').classList.remove('o');addEventListener('keydown',e=>e.key==='Escape'&&$('#qm').classList.remove('o'));
</script></body></html>
